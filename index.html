<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ars | Low Thumbnail Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050101;
            --accent-red: #ad0000;
            --text-white: #ffffff;
            --transition-speed: 0.8s;
            --slider-glow: 0 0 100px rgba(173, 0, 0, 0.2), 0 0 40px rgba(0, 0, 0, 0.8);
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-white: #050101;
            --slider-glow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased; /* Alta calidad de texto */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color var(--transition-speed) ease;
        }

        /* --- BARRA DE PROGRESO PREMIUM --- */
        #progress-container {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 5px;
            background: rgba(255, 255, 255, 0.03); z-index: 1000;
        }
        #progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-red));
            box-shadow: 0 0 20px var(--accent-red);
        }

        /* --- STARTUP OVERLAY --- */
        #startup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
        }
        .startup-logo { color: #fff; font-size: 3rem; font-weight: 900; letter-spacing: 15px; text-transform: uppercase; }
        .fade-out { opacity: 0; visibility: hidden; }

        /* --- NAVEGACIÓN --- */
        nav { padding: 40px 80px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 900; font-size: 2rem; letter-spacing: -1px; text-transform: uppercase; }
        .nav-actions { display: flex; gap: 20px; align-items: center; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(128, 128, 128, 0.2);
            color: var(--text-white); width: 50px; height: 50px; border-radius: 12px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.2rem;
        }
        .nav-btn:hover { border-color: var(--accent-red); color: var(--accent-red); transform: translateY(-5px); }

        /* --- CONTENIDO PRINCIPAL --- */
        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            padding-bottom: 120px;
            isolation: isolate; 
        }
        
        .hero-container {
            position: relative; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            width: 100%; 
            height: 100%; 
            max-width: 1600px;
        }

        .top-label {
            position: absolute;
            top: -130px; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--text-white);
            opacity: 0.3;
            white-space: nowrap;
        }

        .slider-wrapper { 
            position: relative; 
            z-index: 999; 
            will-change: transform; 
        }

        .slider-container {
            width: 720px; height: 405px;
            background: #000; border-radius: 16px;
            overflow: hidden; 
            box-shadow: var(--slider-glow);
            transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .slider-wrapper:hover .slider-container {
            transform: translateY(-20px) scale(1.02);
            border-color: rgba(173, 0, 0, 0.4);
        }

        .slide {
            position: absolute; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1s ease;
            background-size: cover; background-position: center;
        }
        .slide.active { opacity: 1; }

        /* --- LETRAS POSICIÓN ORIGINAL CON ALTA VIBRA --- */
        .bg-text {
            font-family: 'Montserrat', sans-serif; 
            font-size: 11vw; 
            font-weight: 900; 
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(173, 0, 0, 0.3);
            filter: url(#clean-wire);
            position: absolute; 
            z-index: 1; 
            line-height: 0.8; 
            letter-spacing: -2px; 
            pointer-events: none; 
            text-transform: uppercase;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .text-my { top: 6%; left: 0%; }
        .text-works { bottom: -3%; right: 0%; transform: translateY(25%); }

        .slider-wrapper:hover ~ .text-my { 
            transform: translateX(-60px) rotate(-2deg); 
            opacity: 0.8; 
            -webkit-text-stroke: 1.5px rgba(173, 0, 0, 0.7);
        }
        .slider-wrapper:hover ~ .text-works { 
            transform: translateY(25%) translateX(60px) rotate(2deg); 
            opacity: 0.8;
            -webkit-text-stroke: 1.5px rgba(173, 0, 0, 0.7);
        }

        .credits { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 0.75rem; 
            font-weight: 900; 
            opacity: 0.4; 
            z-index: 100; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }

        .arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5); color: white; border: none;
            width: 60px; height: 60px; border-radius: 50%;
            cursor: pointer; z-index: 1100; opacity: 0; transition: 0.3s;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .slider-wrapper:hover .arrow { opacity: 1; }
        .arrow:hover { background: var(--accent-red); transform: translateY(-50%) scale(1.1); }
        .arrow-left { left: -90px; }
        .arrow-right { right: -90px; }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
      <defs>
        <filter id="clean-wire">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.2" result="edge"/>
          <feFlood flood-color="#ad0000" result="red"/>
          <feComposite in="red" in2="edge" operator="in" result="outline"/>
          <feGaussianBlur in="outline" stdDeviation="0.8" result="glow"/>
          <feMerge>
            <feMergeNode in="glow"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <audio id="bg-music" loop>
        <source src="lofi_songs_for_slow_days.mp3" type="audio/mpeg">
    </audio>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="startup-overlay"><div class="startup-logo">Jeshx</div></div>

    <nav>
        <div class="logo">Jeshx</div>
        <div class="nav-actions">
            <button class="nav-btn" id="music-btn"><i class="fa-solid fa-volume-xmark" id="music-icon"></i></button>
            <button class="nav-btn" id="theme-btn"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <a href="https://discord.com/users/1312973413685661736" target="_blank" class="nav-btn" style="background: #5865F2; border:none; color:white;">
                <i class="fa-brands fa-discord"></i>
            </a>
        </div>
    </nav>

    <main>
        <div class="hero-container">
            <div class="slider-wrapper">
                <div class="top-label">Low Thumbnail Designer</div>

                <button class="arrow arrow-left" onclick="prevSlide()"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="arrow arrow-right" onclick="nextSlide()"><i class="fa-solid fa-chevron-right"></i></button>

                <div class="slider-container" id="slider">
                    <div class="slide active" style="background-image: url('miniatura7.png')"></div>
                    <div class="slide" style="background-image: url('miniatura6.png')"></div>
                    <div class="slide" style="background-image: url('miniatura5.png')"></div>
                    <div class="slide" style="background-image: url('miniatura4.png')"></div>
                    <div class="slide" style="background-image: url('miniatura3.png')"></div>
                    <div class="slide" style="background-image: url('miniatura2.png')"></div>
                    <div class="slide" style="background-image: url('miniatura1.png')"></div>
                </div>
            </div>

            <h1 class="bg-text text-my">MY</h1>
            <h1 class="bg-text text-works">WORKS</h1>
        </div>
    </main>

    <div class="credits">Page by: Ars-byte (jeshx)</div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const progressBar = document.getElementById('progress-bar');
        const sliderWrapper = document.querySelector('.slider-wrapper');
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) { music.pause(); musicIcon.className = 'fa-solid fa-volume-xmark'; } 
            else { music.play(); musicIcon.className = 'fa-solid fa-volume-high'; }
            isPlaying = !isPlaying;
        });

        let currentSlide = 0;
        const slideDuration = 4500; 
        let startTime = Date.now();
        let elapsedBeforePause = 0;
        let isPaused = false;

        function updateProgress() {
            if (!isPaused) {
                const currentTime = Date.now();
                const totalElapsed = (currentTime - startTime) + elapsedBeforePause;
                const percentage = Math.min((totalElapsed / slideDuration) * 100, 100);
                progressBar.style.width = percentage + '%';
                if (totalElapsed >= slideDuration) nextSlide();
            }
            requestAnimationFrame(updateProgress);
        }

        function goToSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
            startTime = Date.now();
            elapsedBeforePause = 0;
            progressBar.style.width = '0%';
        }

        function nextSlide() { goToSlide(currentSlide + 1); }
        function prevSlide() { goToSlide(currentSlide - 1); }

        sliderWrapper.addEventListener('mouseenter', () => {
            isPaused = true;
            elapsedBeforePause += (Date.now() - startTime);
        });

        sliderWrapper.addEventListener('mouseleave', () => {
            isPaused = false;
            startTime = Date.now();
        });

        updateProgress();

        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('startup-overlay').classList.add('fade-out'), 1200);
        });

        document.getElementById('theme-btn').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
        });
    </script>
</body>
</html>
